<script>
document.addEventListener("DOMContentLoaded", () => {
    // Создаем один общий темный фон для всех картинок
    const overlay = document.createElement('div');
    overlay.className = 'img-overlay';
    const viewImg = document.createElement('img');
    overlay.appendChild(viewImg);
    document.body.appendChild(overlay);

    let scale = 1;
    let pointX = 0, pointY = 0, startX = 0, startY = 0, isDragging = false;

    // Функция обновления трансформации картинки
    function updateTransform() {
        viewImg.style.transform = `translate(calc(-50% + ${pointX}px), calc(-50% + ${pointY}px)) scale(${scale})`;
    }

    // Закрытие и полный сброс параметров
    function closeOverlay() {
        overlay.style.display = 'none';
        document.body.style.overflow = '';
        scale = 1;
        pointX = 0; pointY = 0;
    }

    // Клик по любой картинке в тексте — открываем во весь экран
    document.querySelectorAll('img:not(.img-overlay img)').forEach(img => {
        img.addEventListener('click', () => {
            viewImg.src = img.src;
            overlay.style.display = 'block';
            document.body.style.overflow = 'hidden'; // Запрещаем скролл самого сайта
            scale = 1;
            pointX = 0; pointY = 0;
            updateTransform();
        });
    });

    // Зум колесиком мыши
    overlay.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSpeed = 0.12;
        
        // Считаем новый масштаб (ограничение от 0.5x до 8x)
        const nextScale = scale + (e.deltaY < 0 ? zoomSpeed : -zoomSpeed);
        if (nextScale >= 0.5 && nextScale <= 8) {
            scale = nextScale;
            updateTransform();
        }
    }, { passive: false });

    // Начало перетаскивания мышкой
    viewImg.addEventListener('mousedown', (e) => {
        e.preventDefault();
        isDragging = true;
        startX = e.clientX - pointX;
        startY = e.clientY - pointY;
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        pointX = e.clientX - startX;
        pointY = e.clientY - startY;
        updateTransform();
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    // Клик по фону закрывает окно (но не при клике по самой картинке)
    overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeOverlay();
    });

    // Надежное закрытие по кнопке ESC
    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && overlay.style.display === 'block') {
            closeOverlay();
        }
    });
});
</script>
